<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <!-- Compatibiliza para versoes mais antigas de navegadores -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <!-- SEO - Tag Title e description - aplicar SEO 
     importante para Google por exemplo-->
    <title>HTML5 e CSS - One Page Site</title>
    <meta name="description" content="Aprenda HTML5, CSS e SEO de forma simples, prática e objetiva desenvolvendo passo a passo do zero até a hospedagem um site one page moderno e responsivo.">

    <!-- icone da aba do navegador favicon -->
     <link rel="icon" href="img/favicon.png">
    <!-- conecta HTML com CSS atalho do comando HTML:CSS -->
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header id="inicio">
        <!-- IMPORTANTE: CSS Flexbox - Fundação Flexível
        Layout fonte, responsivo e flexível
        Organiza as tags dentro de um container de forma dinamica -->
        <div class="Container Flex">
            <!-- Logo do site  -->
            <div id="logo">
                <!-- atributo alt otimizaçao do site e  -->
                <img src="img/logozvnofundo.png" alt="hal 9000">
            </div>
            <!-- Menu Hamburger -->
             <nav>
                <input type="checkbox" id="check">
                <!-- usado um codigo unicode pego no site unicode.org/charts 
                - Miscellaneous Symbols = 286c que tem uma imagem do igual = 
                de forma mais extendida simulando um hamburger -->
                <label for="check">&#x268c;</label>                  
                <ul>
                    <li><a href="#inicio">Início</a></li>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#conteudo">Conteúdo</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>                             
             </nav>             
        </div>
    </header>

    <!-- Destaque -->
    <main>
        <div class="Container">
            <h1>HTML5 e CSS3</h1>
            <h2>Você faz. Você vê. Você aprende.</h2>
            <!-- cria botao com link para direcionar em uma nova aba pelo target=blank -->
             <!-- criada classe Botao padronizando um tipo de botao criado no css dentro de * Layout * -->
            <a href="https://www.youtube.com/playlist?list=PLbEOwbQR9lqySIIlPJ-Qwo4f4HSuXVeWk" target="_blank" class="Botao">Saiba +</a>
        </div>             
    </main>
      
    <!-- Sobre - Conteudo relacionado -->
    <section id="sobre">
        <div class="Container">
            <h2>Aprender na prática.</h2>
        </div>        
    </section>

    <!-- One page - video explicando o que eh site one page -->
    <section>
        <!-- usar palavras chave SEO no subtítulo -->
         <div class="Container">
            <h2>One page site</h2> 
         </div>           
    </section>

    <!-- baixar wireframe do projeto em pdf -->
    <section>
        <div class="Container">
            <h2>Wireframe</h2>
        </div>            
    </section>

    <!-- conteudo - alguns cartoes -->
    <section id="conteudo">
        <div class="Container">
            <h2>Conteúdo</h2> 
            <h3>HTML5</h3>
            <h3>BOX MODEL CSS</h3>    
            <h3>BREAKPOINTS</h3>
        </div>               
    </section>

    <!-- rodape -->
    <footer id="contato">
        <div class="Container">

        </div>
    </footer>
    <!-- botao volta para o topo do site 
     id topo identificar para o css trabalhar ele vai ser colocado no canto direito -->
    <a href="#inicio" id="topo"><img src="img/topo.png" alt="topo do site"></a>

</body>
